# Temporary job: runs the README's documented usage path once on a hosted x64 runner, to capture
# its real output. It is removed before merge.
name: README usage evidence
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  usage:
    if: github.event.label.name == 'readme-usage'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup - the Go toolchain the README requires, from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Capture the documented systemd usage path once
        env:
          USAGE_OUT: ${{ runner.temp }}/readme-usage
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/readme-usage/run.py
      - name: Keep evidence even when a command fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readme-usage
          if-no-files-found: error
          retention-days: 30

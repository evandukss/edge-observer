# The gate. It runs on every pull request, on every push to main - which is how a
# merge arrives - and on a release tag, through release.yml.
#
# The one required check is `verdict`. It names every obligation, and it is green
# only when every obligation the change is subject to ran and passed; plan.sh
# decides which those are from the paths the change touches.
#
# A pull request's code runs here before anybody has reviewed it, and it can
# change this file. So no job here holds a secret or a token that can write, and
# the one privileged job runs only on runners listed in
# .github/gate/privileged-runners.
name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      static: ${{ steps.plan.outputs.static }}
      unit: ${{ steps.plan.outputs.unit }}
      bpf: ${{ steps.plan.outputs.bpf }}
      artifact: ${{ steps.plan.outputs.artifact }}
      attach: ${{ steps.plan.outputs.attach }}
      runners: ${{ steps.plan.outputs.runners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as its merge into the base branch, so
          # the change is that commit against its first parent.
          if [ "$EVENT" = pull_request ]; then
            .github/gate/plan.sh diff HEAD^1 HEAD
          elif [[ "$REF" == refs/tags/* ]]; then
            .github/gate/plan.sh all "a release is qualified on every obligation"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            .github/gate/plan.sh diff "$BEFORE" HEAD
          else
            .github/gate/plan.sh all "the commit before this push is not available to compare against"
          fi

  static:
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/gate/run.sh static
        env:
          GATE_OUT: ${{ runner.temp }}/gate
      # The console carries only the verdict line; the logs under GATE_OUT name
      # what failed. A failed job keeps them for 14 days. The artifact job does
      # not, because its GATE_OUT holds the release archive it must not publish.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-static
          path: ${{ runner.temp }}/gate
          if-no-files-found: warn
          retention-days: 14

  unit:
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/gate/run.sh unit
        env:
          GATE_OUT: ${{ runner.temp }}/gate
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-unit-${{ matrix.runner }}
          path: ${{ runner.temp }}/gate
          if-no-files-found: warn
          retention-days: 14

  bpf:
    needs: plan
    if: needs.plan.outputs.bpf == 'true'
    # bpf/gen.go compiles against the arm64 multiarch include directory, so the
    # objects can be regenerated only on arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/gate/run.sh bpf
        env:
          GATE_OUT: ${{ runner.temp }}/gate
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-bpf
          path: ${{ runner.temp }}/gate
          if-no-files-found: warn
          retention-days: 14

  artifact:
    needs: plan
    if: needs.plan.outputs.artifact == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The archive is built exactly as a release builds it, checked, and thrown
      # away: nothing here uploads or publishes it.
      - run: |
          test -z "$(git status --porcelain)" || { echo "the checkout is not clean"; exit 1; }
          .github/gate/run.sh archive "$(git rev-parse HEAD)"
        env:
          GATE_OUT: ${{ runner.temp }}/gate

  attach:
    needs: plan
    if: needs.plan.outputs.attach == 'true' && needs.plan.outputs.runners != '[]'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The privileged test container shares this runner's kernel. Make its
      # TLS ULP available here; the sendfile test measures whether kTLS works.
      - name: Make kernel TLS available
        run: |
          if ! sudo modprobe tls; then
            echo "Kernel TLS module unavailable; the sendfile test must report its precondition."
          fi
      - run: uname -srm && .github/gate/run.sh attach
        env:
          GATE_OUT: ${{ runner.temp }}/gate
      # Successful jobs keep their console, not the uploaded failure logs.
      # Preserve only this test's measured count, including an UNPROVED skip.
      - name: Report sendfile precondition
        if: always()
        env:
          GATE_OUT: ${{ runner.temp }}/gate
        run: |
          awk '
            /^=== RUN   TestProducerSendfileMovementLeavesNumberedHole$/ { active = 1; next }
            /^--- (PASS|FAIL|SKIP): TestProducerSendfileMovementLeavesNumberedHole / { active = 0 }
            active && /producer_certification_test[.]go:[0-9]+: (PRECONDITIONS |UNPROVED: )/ &&
              /kTLS_enabled_connections=/ && /successful_sendfile_byte_moves=/ { print; count++ }
            END {
              if (count != 1) {
                print "::error::Expected one sendfile precondition count; found " (count + 0)
                exit 1
              }
            }
          ' "$GATE_OUT/attach/run.log"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-attach-${{ matrix.runner }}
          path: ${{ runner.temp }}/gate
          if-no-files-found: warn
          retention-days: 14

  verdict:
    needs: [plan, static, unit, bpf, artifact, attach]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/gate/verdict.sh
        env:
          NEEDS: ${{ toJSON(needs) }}
          PLAN: ${{ needs.plan.outputs.plan }}
